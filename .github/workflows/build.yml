name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The tag builds publish to the GitHub release the packaged app's updater
# polls; that needs the token to write contents. Nothing else does.
permissions:
  contents: write

jobs:
  # Cheap gate on every push: types and unit tests need no Electron and no
  # Windows runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The installers, built where they ship. On a tag they are published to
  # the release; on any other push they are kept as workflow artifacts.
  #
  # One job per OS, both macOS architectures from the one Apple-silicon
  # runner: Monet Local has no native modules, so the x64 build is only
  # Electron's own x64 binary, which electron-builder downloads.
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            name: monet-local-windows
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: macos-latest
            args: --mac --arm64 --x64
            name: monet-local-mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unsigned on macOS: there is no Developer ID here. Gatekeeper will
      # quarantine the download; `xattr -cr "/Applications/Monet Local.app"`
      # clears it. Signing and notarization are a certificate away — see
      # electron-builder.yml.
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
